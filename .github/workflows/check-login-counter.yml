name: Check page visits and named user counts
on:
  push:
    paths:
      - 'visit-counter.mjs'
      - 'tests/visit-counter*.mjs'
      - '.github/workflows/check-login-counter.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Check page-open and per-name counter logic
        run: node tests/visit-counter.test.mjs
      - name: Verify shared counter, Unicode index and browser CORS with separate test keys
        run: node tests/visit-counter-live.mjs
