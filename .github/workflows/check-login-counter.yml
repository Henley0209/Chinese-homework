name: Check login counter
on:
  push:
    paths:
      - 'visit-counter.mjs'
      - 'tests/visit-counter*.mjs'
      - '.github/workflows/check-login-counter.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Check counter logic
        run: node tests/visit-counter.test.mjs
      - name: Verify shared service and browser CORS using a separate test counter
        run: node tests/visit-counter-live.mjs
