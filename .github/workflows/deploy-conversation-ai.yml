name: Deploy real conversation AI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/enable-conversation-ai.py
      - backend/conversation/**
      - conversation-topic.mjs
      - conversation-topics.mjs
      - conversation-core.mjs
      - conversation-keywords.mjs
      - vendor/chinese-simplified.mjs
      - .github/workflows/deploy-conversation-ai.yml
permissions:
  contents: write
concurrency:
  group: deploy-conversation-ai
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check required account configuration
        shell: bash
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name. Configure it under Settings > Secrets and variables > Actions."
              exit 1
            fi
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate conversation service
        run: node --test tests/conversation.test.mjs
      - name: Deploy free Workers AI service
        shell: bash
        run: |
          mkdir -p work
          npx --yes wrangler@4 deploy --config backend/conversation/wrangler.toml 2>&1 | tee work/conversation-deploy.log
      - name: Check real AI response before enabling website
        run: python3 tools/enable-conversation-ai.py
      - name: Publish verified AI endpoint
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add conversation-config.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Enable verified real AI conversation endpoint'
          git pull --rebase origin main
          git push origin HEAD:main
