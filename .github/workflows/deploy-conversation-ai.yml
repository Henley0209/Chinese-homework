name: Deploy real conversation AI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/enable-conversation-ai.py
      - backend/conversation/**
      - conversation-fallback.mjs
      - courseware-core.mjs
      - courseware-generation.mjs
      - courseware-pinyin.mjs
      - vendor/pinyin-pro.mjs
      - tools/verify-courseware-live.mjs
      - homework-core.mjs
      - homework-plan.mjs
      - lesson-data.mjs
      - lesson-payroll.mjs
      - tests/lesson-payroll.test.mjs
      - tests/lesson-register.test.mjs
      - tests/lesson-backup.test.mjs
      - tools/verify-homework-live.mjs
      - tools/verify-homework-vocabulary-live.mjs
      - teacher-auth.mjs
      - conversation-topic.mjs
      - conversation-topics.mjs
      - conversation-core.mjs
      - conversation-keywords.mjs
      - vendor/chinese-simplified.mjs
      - .github/workflows/deploy-conversation-ai.yml
permissions:
  contents: write
concurrency:
  group: deploy-conversation-ai
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check required account configuration
        shell: bash
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name. Configure it under Settings > Secrets and variables > Actions."
              exit 1
            fi
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate conversation service
        run: node --test tests/courseware-pinyin.test.mjs tests/courseware-generation.test.mjs tests/courseware.test.mjs tests/conversation.test.mjs tests/homework.test.mjs tests/homework-plan.test.mjs tests/homework-courseware.test.mjs tests/homework-courseware-plan.test.mjs tests/homework-rules.test.mjs tests/lesson-register.test.mjs tests/lesson-payroll.test.mjs tests/lesson-backup.test.mjs
      - name: Deploy free Workers AI service
        shell: bash
        run: |
          mkdir -p work
          npx --yes wrangler@4 deploy --config backend/conversation/wrangler.toml 2>&1 | tee work/conversation-deploy.log
      - name: Verify the live teacher attendance endpoint
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {setTimeout as delay} from 'node:timers/promises';
          const url=new URL('/lesson-register',JSON.parse(readFileSync('conversation-config.json','utf8')).endpoint);
          const headers={Origin:'https://henley0209.github.io','Content-Type':'application/json'};
          for(let attempt=1;attempt<=8;attempt++){
            try{
              const response=await fetch(url,{method:'POST',headers,body:JSON.stringify({action:'teacher-classes'}),signal:AbortSignal.timeout(10000)});
              assert.equal(response.status,401);
              assert.equal((await response.json()).error,'请先登录。');
              assert.equal(response.headers.get('access-control-allow-origin'),headers.Origin);
              console.log('Teacher attendance endpoint is live and requires authentication.');
              break;
            }catch(error){
              if(attempt===8)throw error;
              console.log('Waiting for Worker deployment propagation ('+attempt+'): '+error.message);
              await delay(5000);
            }
          }
          JS
      - name: Check real AI response before enabling website
        run: |
          python3 tools/enable-conversation-ai.py 2>&1 | tee work/conversation-verification.log
      - name: Install temporary homework verification credential
        id: verification-credential
        run: |
          token="$(node -e "console.log(Date.now()+'.'+require('node:crypto').randomBytes(32).toString('hex'))")"
          echo "::add-mask::$token"
          echo "HOMEWORK_VERIFY_TOKEN=$token" >> "$GITHUB_ENV"
          printf '%s' "$token" | npx --yes wrangler@4 secret put HOMEWORK_VERIFY_TOKEN --config backend/conversation/wrangler.toml
      - name: Verify live Chinese–Vietnamese vocabulary homework
        run: node tools/verify-homework-vocabulary-live.mjs
      - name: Verify all six courseware banks and a complete generated lesson
        run: node tools/verify-courseware-live.mjs
      - name: Verify real 50-question HSK4, HSK5 and local courseware homework
        if: ${{ !cancelled() && steps.verification-credential.outcome == 'success' }}
        run: node tools/verify-homework-live.mjs
      - name: Preserve inspectable generated courseware samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-courseware-samples
          path: work/courseware-*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove temporary homework verification credential
        if: always()
        run: printf 'y\n' | npx --yes wrangler@4 secret delete HOMEWORK_VERIFY_TOKEN --config backend/conversation/wrangler.toml
      - name: Report real AI verification failure
        if: failure()
        shell: bash
        run: |
          if [ -f work/conversation-verification.log ]; then
            echo '### Real AI verification failure' >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -50 work/conversation-verification.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish verified AI endpoint
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add conversation-config.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Enable verified real AI conversation endpoint'
          git pull --rebase origin main
          git push origin HEAD:main
