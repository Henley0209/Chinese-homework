name: Generate 200 dialogues per exercise
on:
  push:
    branches: [main]
    paths:
      - tools/generate-conversation-banks.py
      - exercise-catalog.json
      - tests/conversation-banks.test.mjs
      - .github/workflows/generate-conversation-banks.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: generate-conversation-banks
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pypinyin==0.55.0
      - name: Generate curriculum-derived Chinese, pinyin and answer keywords
        run: python tools/generate-conversation-banks.py
      - name: Check short grammar dialogue keywords
        run: python tests/conversation-content-keywords.py
      - name: Verify every visible exercise has exactly 200 unique questions
        run: node --test tests/conversation-banks.test.mjs
      - name: Publish all validated dialogue banks
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add conversation-banks/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish 200 validated dialogue pairs per visible exercise'
          git pull --rebase origin main
          git push origin HEAD:main
