name: Generate HSK conversation Xiaoxiao preview
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-conversation-preview-audio.yml'
      - 'tools/conversation-preview-corpus.mjs'
      - 'tools/conversation-preview-audio.py'
      - 'conversation-preview/hsk-lesson-01/index.html'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: conversation-preview-audio
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install 'edge-tts>=7.2.3,<8' 'mutagen>=1.47,<2'
      - run: node tools/conversation-preview-corpus.mjs
      - run: python tools/conversation-preview-audio.py work/conversation-audio/corpus.json
      - name: Publish verified Xiaoxiao recordings
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add conversation-preview/hsk-lesson-01/audio/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish fixed Xiaoxiao recordings for HSK lesson 1 preview'
          git pull --rebase origin main
          git push origin HEAD:main
