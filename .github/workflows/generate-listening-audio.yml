name: Generate fixed listening voices
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-listening-audio.yml'
      - 'tools/listening-audio-corpus.mjs'
      - 'tools/listening-audio-generate.py'
      - 'listening/data.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fixed-listening-audio
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install speech generator
        run: python -m pip install 'edge-tts>=7.2.3,<8' 'mutagen>=1.47,<2'
      - name: Prepare complete question and option corpus
        run: node tools/listening-audio-corpus.mjs
      - name: Generate and verify Xiaoxiao and Yunxi audio
        run: python tools/listening-audio-generate.py work/listening-audio/corpus.json
      - name: Upload generated audio backup
        uses: actions/upload-artifact@v4
        with:
          name: listening-fixed-voices
          path: listening/audio/
      - name: Save verified audio to website repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add listening/audio/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Upload verified Xiaoxiao and Yunxi listening recordings'
          git pull --rebase origin main
          git push origin HEAD:main
