name = "chinese-homework-conversation"
main = "worker.mjs"
compatibility_date = "2026-10-01"

[vars]
ALLOWED_ORIGIN = "https://henley0209.github.io"
AI_MODEL = "@cf/openai/gpt-oss-120b"
DAILY_PER_IP = "200"
DAILY_TOTAL = "500"

[[durable_objects.bindings]]
name = "LIMITS"
class_name = "ConversationLimits"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ConversationLimits"]

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "PUBLISHED_HOMEWORK"
class_name = "PublishedHomework"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["PublishedHomework"]

[[durable_objects.bindings]]
name = "LESSON_REGISTER"
class_name = "LessonRegister"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["LessonRegister"]

[[durable_objects.bindings]]
name = "LESSON_BACKUP"
class_name = "LessonBackup"

[[migrations]]
tag = "v4"
new_sqlite_classes = ["LessonBackup"]

[triggers]
# Sunday 02:00 in Asia/Bangkok.
crons = ["0 19 * * SAT"]
