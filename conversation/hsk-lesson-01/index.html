<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HSK 第1课 · AI 对话练习</title><link rel="stylesheet" href="../../style-classroom-v4.css?v=remember11"><link rel="stylesheet" href="../../conversation.css?v=bank2001"><style>main{max-width:850px;margin:32px auto;padding:0 16px}h1{font-size:28px}.lesson-status{padding:12px 16px;border-radius:12px;background:#fff5dd}a{color:#2476b5}</style></head><body><main><p><a href="../../">返回主页</a> · <a href="../../conversation-preview/hsk-lesson-01/?v=rate09">试听示例</a></p><h1>HSK 第1课：你好！</h1><p>真实 AI 对话 · 中文朗读（晓晓优先）· 0.75 倍速</p><p class="lesson-status" id="service-status" role="status">正在检查 AI 服务配置…</p><section id="welcome" class="panel"><h2>跟 AI 练习打招呼 · 主题互动对话</h2><p>本课主题：你好、您好、早上好、谢谢、不客气、对不起、没关系、再见。</p><p>AI 先开口，说完1秒后自动收音；你说完后安静2秒会自动提交。语法或内容有误时，AI 会朗读“这句话可以这样回答：……”及示范，然后继续追问。</p><p class="note">首次使用请允许麦克风。优先使用设备提供的晓晓音色；没有时会使用云端中文朗读。回答发送到 AI 进行评估；对话文字和进度仅保存在当前浏览器，重新进入时恢复。</p><button type="button" id="practice-conversation" class="primary" disabled>进入第1课对话 / Bắt đầu bài 1</button><p id="bank-error" role="alert"></p></section><section id="conversation-practice" class="panel" hidden tabindex="-1" aria-label="对话练习"></section></main><script type="module">
import {initConversation} from '../../conversation.mjs?v=greeting1';
const status=document.getElementById('service-status'),entry=document.getElementById('practice-conversation');
try{
 const response=await fetch('../../hsk1-2-30/lesson-01.json',{cache:'no-store'});if(!response.ok)throw Error('第1课内容加载失败，请刷新重试。');const lesson=await response.json();
 initConversation({fixedLesson:lesson,configUrl:'../../conversation-config.json?v=real-ai09'});
 const configResponse=await fetch('../../conversation-config.json?v=real-ai09',{cache:'no-store'});if(!configResponse.ok)throw Error('AI 配置暂不可用，请刷新重试。');const config=await configResponse.json();
 if(!config.endpoint){status.textContent='真实 AI 尚未开通：等待配置 Cloudflare Workers AI 免费服务。此页不会使用示例冒充 AI 回答。';}
 else{status.textContent='已配置真实 AI 接口。点击进入第1课，连接后由 AI 发起对话。';entry.disabled=false;}
}catch(error){status.textContent=error.message;}
